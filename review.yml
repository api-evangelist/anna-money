      status: 000
      note: Did not resolve.
    - url: https://anna.money/developers
      status: 404
    - url: https://anna.money/api
      status: 404
    - url: https://api.anna.money/
      status: 404
    - url: https://anna.money/open-banking/v2.3/atms
      status: 404
      note: Standard OBIE Open Data ATMs path - not present.
    - url: https://anna.money/.well-known/open-banking
      status: 200
      note: Returns the site SPA HTML shell (text/html), not a real Open Banking well-known JSON resource.
    - url: https://www.anna.money/
      status: 200
    - url: https://github.com/anna-money
      status: 200
      note: Real ANNA engineering GitHub org - open-source tooling, not product APIs.
    - url: https://www.linkedin.com/company/annamoneyuk
      status: 200
